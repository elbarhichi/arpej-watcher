name: Tests

on:
  push:
    paths:
      - "**.py"
      - "config.json"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "config.json"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
